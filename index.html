<!doctype html>
<!--
  The single HTML entry point. viewport-fit=cover lets the app paint under the iPhone
  notch and home indicator; the safe-area utilities in src/index.css keep content clear.
  Change: the <title>, and nothing else - UI lives in src/.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>fintech-helper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
